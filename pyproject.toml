[project]
name = "paasify"
version = "0.2.0"
description = "Manage docker compose environments"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
paasify = "paasify.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paasify"]

